name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Web (".") and desktop ("electron") each have their own config, manifest
    # and PR labels, so merging one release PR never conflicts with or blocks
    # the other.
    outputs:
      web_release_created: ${{ steps.web.outputs.release_created }}
      desktop_release_created: ${{ steps.desktop.outputs['electron--release_created'] }}
    steps:
      - name: Release Please (web)
        id: web
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Release Please (desktop)
        id: desktop
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: electron/release-please-config.json
          manifest-file: electron/.release-please-manifest.json

  # A desktop release is built and published to natyconnor/berean-desktop.
  # If it fails (say notarization times out), use "Re-run failed jobs" on
  # this run, or Actions → Desktop release → Run workflow on main. "Re-run
  # all jobs" does not work: release-please has already made the release, so
  # the second run reports none created and skips this job.
  desktop-release:
    needs: release-please
    if: needs.release-please.outputs.desktop_release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit

  deploy:
    needs: release-please
    if: needs.release-please.outputs.web_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@65.15.0

      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
