name: Desktop release

# Builds the Mac desktop app from electron/ and publishes it to
# natyconnor/berean-desktop. Run by hand only (Actions → Desktop release →
# Run workflow); web releases never trigger it. See electron/README.md.
#
# With all signing, notarization and publishing secrets: a signed, notarized
# universal Berean.dmg, the zip and latest-mac.yml are published as release
# v<electron/package.json version>. Without them: an unsigned Berean.dmg is
# uploaded as a workflow artifact and nothing is published.

on:
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RELEASES_REPO: natyconnor/berean-desktop
      # "true" only when every secret a signed release needs is set.
      CAN_RELEASE: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.DESKTOP_RELEASES_TOKEN != '' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Read the desktop version
        id: version
        run: |
          version="$(node -p "require('./electron/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Desktop version: $version (signed release: $CAN_RELEASE)"

      - name: Releases come from main
        if: env.CAN_RELEASE == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Signed releases are built from main only (this run is on $GITHUB_REF)."
          exit 1

      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(gh api --include "repos/$RELEASES_REPO/releases/tags/v$VERSION" 2>/dev/null | head -n 1 | awk '{print $2}' || true)"
          case "$status" in
            200)
              echo "::error::$RELEASES_REPO already has release v$VERSION. Bump the version in electron/package.json first."
              exit 1
              ;;
            404)
              echo "No release v$VERSION yet."
              ;;
            *)
              echo "::error::Could not check $RELEASES_REPO for v$VERSION (HTTP status: ${status:-none})."
              exit 1
              ;;
          esac

      - name: Explain the unsigned build
        if: env.CAN_RELEASE != 'true'
        run: |
          echo "::warning::Signing, notarization or publishing secrets are missing, so this run builds an unsigned Berean.dmg as a workflow artifact and publishes nothing. Needed: CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER, DESKTOP_RELEASES_TOKEN."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir electron install --frozen-lockfile

      # electron-builder wants the App Store Connect key as a file path.
      - name: Write the notarization key
        if: env.CAN_RELEASE == 'true'
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
        run: |
          key_file="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENTS" > "$key_file"
          chmod 600 "$key_file"
          echo "APPLE_API_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: env.CAN_RELEASE == 'true'
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_FILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm run dist

      # electron-builder skips signing, without failing, when it cannot use
      # the certificate. Never publish an app that is not signed and notarized.
      - name: Check the signature and notarization
        if: env.CAN_RELEASE == 'true'
        working-directory: electron/release
        run: |
          app="mac-universal/Berean.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | tee codesign.txt
          grep -q "^Authority=Developer ID Application" codesign.txt
          grep -q "flags=.*runtime" codesign.txt
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/Berean" | grep -q "x86_64 arm64"
          rm codesign.txt

      - name: Publish the release
        if: env.CAN_RELEASE == 'true'
        working-directory: electron/release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="Berean-$VERSION-universal-mac.zip"
          # gh uploads every file before the release becomes visible.
          gh release create "v$VERSION" \
            --repo "$RELEASES_REPO" \
            --title "Berean $VERSION" \
            --notes "Berean for Mac $VERSION. Built from $GITHUB_REPOSITORY@$GITHUB_SHA." \
            --latest \
            Berean.dmg Berean.dmg.blockmap \
            "$zip" "$zip.blockmap" \
            latest-mac.yml

      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: Build unsigned
        if: env.CAN_RELEASE != 'true'
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run dist:unsigned

      - name: Upload the unsigned DMG
        if: env.CAN_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Berean-${{ steps.version.outputs.version }}-unsigned
          path: electron/release/Berean.dmg
          if-no-files-found: error
          retention-days: 14
